<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你好</title>
<meta name="description" content="一个安静的角落。">
<meta name="theme-color" content="#0b1020">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:24px;min-height:100vh;
    display:grid;place-items:center;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:#e6edf7;
    background:
      radial-gradient(900px 520px at 12% -12%, rgba(59,130,246,.30), transparent 62%),
      radial-gradient(760px 460px at 92% 112%, rgba(168,85,247,.24), transparent 62%),
      #0b1020;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:540px;
    padding:44px 40px 30px;border-radius:26px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(16px) saturate(140%);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .mark{
    width:70px;height:70px;border-radius:22px;margin-bottom:22px;
    display:grid;place-items:center;font-size:30px;
    background:linear-gradient(135deg,#3b82f6,#a855f7);
    box-shadow:0 12px 30px rgba(59,130,246,.35);
  }
  h1{
    margin:0 0 10px;font-size:32px;line-height:1.2;letter-spacing:-.5px;
    background:linear-gradient(120deg,#fff,#a9c6ff 60%,#d8b4fe);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{margin:0 0 26px;font-size:15.5px;line-height:1.7;color:#9fb0c9}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .item{
    padding:13px 15px;border-radius:14px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);
  }
  .k{display:block;font-size:11.5px;color:#8296b3;margin-bottom:5px;letter-spacing:.3px}
  .v{display:block;font-size:14.5px;font-weight:600;color:#dbe6f5;
     font-variant-numeric:tabular-nums;word-break:break-word}

  .note{
    margin:18px 0 0;font-size:12px;line-height:1.6;color:#7185a3;
  }
  footer{
    margin-top:22px;padding-top:18px;
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;flex-wrap:wrap;gap:8px 14px;
    font-size:12.5px;color:#7185a3;
  }
  @media (max-width:480px){
    .card{padding:32px 24px 24px;border-radius:20px}
    h1{font-size:26px}
    .mark{width:58px;height:58px;font-size:25px;border-radius:18px}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">✦</div>
    <h1>你好</h1>
    <p class="tagline">这里是一个安静的角落。暂时没有什么，只有一点时间和一点光。</p>

    <div class="grid">
      <div class="item"><span class="k">你的本地时间</span><span class="v" id="clock">—</span></div>
      <div class="item"><span class="k">你的时区</span><span class="v" id="tz">—</span></div>
      <div class="item"><span class="k">你的界面语言</span><span class="v" id="lang">—</span></div>
      <div class="item"><span class="k">你的窗口尺寸</span><span class="v" id="vp">—</span></div>
    </div>

    <p class="note">以上信息由你的浏览器在本地计算并直接显示，不会被发送或保存到任何地方。</p>

    <footer><span id="hello">…</span></footer>
  </main>

<script type="module">
const $ = (id) => document.getElementById(id);

function pad(n){ return String(n).padStart(2,'0'); }

function tick(){
  const now = new Date();
  $('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  $('tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || '—';
}
tick();
setInterval(tick, 1000);

$('lang').textContent = navigator.language || '—';

function size(){
  $('vp').textContent = window.innerWidth + ' × ' + window.innerHeight;
}
size();
addEventListener('resize', size);

const h = new Date().getHours();
$('hello').textContent =
  h < 5  ? '夜很深了。' :
  h < 11 ? '早上好。' :
  h < 14 ? '中午好。' :
  h < 18 ? '下午好。' :
  h < 23 ? '晚上好。' :
           '夜深了，早点休息。';
</script>
</body>
</html>
